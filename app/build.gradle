plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.numerasiapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.numerasiapp"
        minSdk 24
        targetSdk 36
        versionCode 14 // Naikkan angka ini setiap kali mengunggah AAB baru ke Play Console
        versionName "1.0.13"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'

    // Wajib untuk ProcessLifecycleOwner & DefaultLifecycleObserver (App Open Ad)
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

    // Google Mobile Ads SDK (App Open, Native Advanced, Interstitial)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Firebase BoM (Kompatibel dengan Java & kebijakan Families)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
}
