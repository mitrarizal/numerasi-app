plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.numerasiapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.numerasiapp"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            // Membaca file keystore dan kredensial dari Environment Variables (GitHub Secrets)
            storeFile file(System.getenv("KEYSTORE_FILE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:35.0.1')
    implementation 'com.google.firebase:firebase-analytics'

    // DataStore (Wajib ditambahkan agar Firebase versi terbaru tidak mengalami NoClassDefFoundError)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.datastore:datastore-core:1.1.1'
}
