# Alokasi memori RAM untuk mencegah OutOfMemoryError saat build
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.nonTransitiveRClass=true

# Menyembunyikan peringatan AGP untuk compileSdk 36
android.suppressUnsupportedCompileSdk=36

# Nonaktifkan mode R8 fullMode agar kelas utama tidak terhapus saat build release
android.enableR8.fullMode=false
